appId: co.eris.epona
productName: Epona
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!packages/da-win32/src/**'
  - '!packages/da-win32/binding.gyp'
  # The scaffold excludes above miss every other dev tree in the repo root, so
  # coverage/, e2e/, docs/ and CLAUDE.md used to ship inside app.asar — none are
  # reachable at runtime and the docs are internal. resources/** must survive:
  # it's asarUnpack'd and holds splash.html + the runtime-sized logo assets.
  #
  # The 1024px icon master lives in build/, NOT resources/, and the icon: keys
  # below point there. resources/ is both asarUnpack'd AND vite's publicDir
  # (electron.vite.config.mjs), so anything in it ships TWICE — the master was
  # 1.7MB of payload nothing loads at runtime. build/ is directories.
  # buildResources, which electron-builder never packages, so the icons are
  # still generated from it and the payload is gone.
  - '!{coverage,e2e,test-results,playwright-report,docs,scripts,.claude,.agents,.codex,.github}/*'
  - '!{CLAUDE.md,playwright.config.mjs,vitest.config.js,eslint.config.mjs}'
  - '!**/*.tsbuildinfo'
asarUnpack:
  - resources/**
  - node_modules/da-win32/build/**
  - packages/da-win32/build/**
win:
  executableName: Epona
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # The portable exe is an NSIS self-extracting archive: every launch
  # decompresses the whole app into %TEMP% before electron exists, so no in-app
  # splash can cover it — and the stub runs `SetSilent silent` unless
  # SPLASH_IMAGE is defined, meaning the user gets nothing for several seconds
  # (measured here: ~3.3s before the first Epona process). The electron runtime
  # dominates that unpack, so slimming app.asar does not remove the wait.
  #
  # This BMP deliberately MIRRORS resources/splash.html rather than just showing
  # the icon: same 360x300 as the splash BrowserWindow, same radial gradient
  # (#16294a → #0c1524 offset toward the top), same 148px logo, same EPONA
  # wordmark (#f0e6cc, 22px, 3px tracking) and "Loading…" (#7f8fb0, 12px). The
  # extraction splash then hands off to the electron splash with no visible
  # change except the spinner starting — the gap at the bottom is where it goes.
  # A static BMP cannot animate, which is the only reason the spinner is absent.
  #
  # 24-bit, in build/ (buildResources — never packaged). Regenerate with:
  #   magick -size 360x600 radial-gradient:'#16294a'-'#0c1524' \
  #     -crop 360x300+0+204 +repage \
  #     \( build/icon.png -resize 148x148 \) -gravity north -geometry +0+18 \
  #     -composite -gravity north \
  #     -font Segoe-UI-Semibold -pointsize 22 -kerning 3 -fill '#f0e6cc' \
  #       -annotate +0+186 'EPONA' \
  #     -font Segoe-UI -pointsize 12 -kerning 1 -fill '#7f8fb0' \
  #       -annotate +0+220 'Loading…' \
  #     -flatten -strip -type TrueColor BMP3:build/portable-splash.bmp
  # (The oversized gradient + crop puts the gradient's centre at 32% height, to
  # match the CSS `radial-gradient(circle at 50% 32%, …)` in splash.html.)
  splashImage: build/portable-splash.bmp
nsis:
  # Predictable name for the release workflow's sign + upload steps (the default
  # is "Epona Setup <version>.exe", with spaces).
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  category: public.app-category.games
  icon: build/icon.png
  # da-win32 is a Windows-only native module; on macOS it compiles to an
  # empty stub that's never require()'d (the load is gated behind
  # process.platform === 'win32'). The stub is byte-identical across arches
  # and can't be lipo-merged, so tell @electron/universal to ship it as-is
  # rather than failing the arch merge.
  x64ArchFiles: '**/da_win32.node'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  category: Game
  icon: build/icon.png
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  target:
    - deb
    - AppImage
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
beforeBuild: npx @electron/rebuild -f -w da-win32
