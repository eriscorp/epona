appId: co.eris.epona
productName: Epona
# Becomes LegalCopyright in the Windows VERSIONINFO resource. A PE with
# blank version metadata scores worse with reputation-based scanners, and
# this is the only VERSIONINFO field electron-builder lets us set
# directly (FileDescription/ProductName come from productName, CompanyName
# from package.json `author`). Name the same entity as the signing cert's
# CN so the properties dialog and the "Verified publisher" string agree.
copyright: Copyright © 2026 ERISCO LLC
# Turn off escape hatches built into the Electron binary that Epona never uses.
# The one that matters is runAsNode: without it,
#   ELECTRON_RUN_AS_NODE=1 Epona.exe -e "<script>"
# turns the shipped, signed binary into a general-purpose Node interpreter — a
# real capability handed to anything that can set an environment variable. It
# also makes the app immune to the trap where that variable, exported in a
# shell, makes a healthy launch look like a crash.
#
# onlyLoadAppFromAsar is the one that can break a packaged launch, and epona is
# the first app in the house to combine it with an asarUnpack'd NATIVE addon
# (da-win32 resolves out of app.asar.unpacked). Verified on a real package: the
# fuse governs where APP code is loaded from, not native module resolution, and
# the addon still loads. Re-check it if the asarUnpack list changes.
#
# Native electron-builder config, NOT an afterPack hook: on the mac universal
# build the per-arch packs must stay pristine and the fuses have to be flipped
# once on the merged app right before signing. A per-arch hook corrupts the
# universal merge with an "identical SHAs" failure.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  # Electron checks app.asar against the hash electron-builder embeds in the
  # executable, file by file as it reads (HTOO-381; house decision, Sabrael,
  # 2026-09-28). electron-builder writes the hashes whatever the fuse says;
  # the fuse only makes Electron enforce them. Linux ignores it.
  #
  # A changed asar is then a DEAD app: exit code 1 and `ASAR Integrity
  # Violation` on stderr only, no window. scripts/verify-fuses.mjs reads the
  # fuse in each release build job, and docs/release-process.md starts a
  # packaged build before the tag.
  #
  # The asarUnpack'd trees below are outside the check. The afterPack hook
  # signs da_win32.node after the asar is built and relies on that. The
  # threat model is in SECURITY.md. Cost (HTOO-399, measured in oghma):
  # nothing warm, 10-25 ms on a launch from new files (every portable start).
  enableEmbeddedAsarIntegrityValidation: true
  # Flipping fuses rewrites the Electron Framework binary and invalidates the
  # ad-hoc signature that is mandatory on Apple Silicon; re-apply it before the
  # real signing step runs.
  resetAdHocDarwinSignature: true
directories:
  buildResources: build
# ALLOWLIST, not a denylist. electron-builder packages the whole project
# directory by default and `files` subtracts from it, so the scaffold's negation
# list leaks every time a new top-level directory appears — and it did. The
# previous list also used the single-star form (`!coverage/*`), which drops only
# a directory's immediate children: coverage/lcov-report/** (7.4 MB), docs/images/**
# (5.2 MB of demo GIFs) and .github/workflows/** all still shipped inside app.asar.
# An allowlist cannot leak that way. Name what runs; everything else is absent by
# construction.
#
# resources/** must survive: it is asarUnpack'd and holds splash.html plus the
# runtime-sized logo assets. The 1024px icon master lives in build/, NOT
# resources/, and the icon: keys below point there — build/ is
# directories.buildResources, which electron-builder never packages, so the
# icons are still generated from it and the payload is gone.
#
# packages/da-win32 is the workspace member behind the `da-win32` file: dep. Its
# build output is loaded via createRequire at run time (and asarUnpack'd below),
# so the compiled addon ships while its C++ sources and binding.gyp do not.
#
# Name the ONE .node file, not build/**. node-gyp leaves 9.0 MB in build/ and
# index.js loads exactly `./build/Release/da_win32.node` from it — the rest is
# linker and MSBuild intermediates (build/Release/obj/**.tlog alone is 3.5 MB,
# plus .iobj/.ipdb/.lib/.exp). The old denylist shipped all of it because it only
# excluded src/ and binding.gyp.
#
# CHANGELOG.md ships deliberately — Settings > About > What's New reads it from
# app.getAppPath() at run time. It is the one doc that is a runtime asset.
files:
  - out/**
  - resources/**
  - node_modules/**
  # npm links the da-win32 workspace member into node_modules, so the addon's
  # build dir arrives through the broad node_modules allow above as well. Only
  # da_win32.node is loaded; subtract the MSBuild + linker leftovers beside it.
  - '!node_modules/da-win32/build/Release/obj/**'
  - '!node_modules/da-win32/build/Release/*.{exp,iobj,ipdb,lib}'
  - '!node_modules/da-win32/build/*.{vcxproj,filters}'
  # bin/ is @electron/rebuild's cache (gitignored). index.js loads
  # ./build/Release/da_win32.node and nothing reads bin/, so this was a third
  # byte-identical copy of the addon riding along. It has to be subtracted on
  # BOTH paths — the junction means dropping it from packages/ alone leaves the
  # node_modules/ copy shipping. Verified with `find dist -name '*.node'`:
  # three identical hashes before, two after. Shipping needless copies of the
  # one binary here whose imports look like process injection is the last thing
  # this app needs; see docs/antivirus.md.
  - '!node_modules/da-win32/bin/**'
  - packages/da-win32/{index.js,package.json}
  - packages/da-win32/build/Release/da_win32.node
  - package.json
  - CHANGELOG.md
asarUnpack:
  - resources/**
  - node_modules/da-win32/build/**
  - packages/da-win32/build/**
win:
  executableName: Epona
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Custom sign hook rather than electron-builder's default signtool.exe,
  # which cannot reach a cert hosted in ssl.com Cloud eSigner. Ported from
  # the sibling launcher, which has run it through several releases.
  #
  # This replaced two post-hoc `sslcom/esigner-codesign` steps in
  # release.yml that signed ONLY the two finished artifacts. Everything
  # the portable exe unpacked into %TEMP% was therefore unsigned inside a
  # signed wrapper — an unsigned payload behind a self-extracting stub,
  # which is part of why 2.7.1 tripped Trojan:Win32/Wacatac.C!ml. The hook
  # is invoked once per signable binary instead: Epona.exe,
  # resources/elevate.exe, the uninstaller, and both artifacts.
  #
  # It does NOT cover da_win32.node — electron-builder's signable-file
  # walk ignores asarUnpack'd files. See the afterPack hook at the bottom.
  #
  # publisherName must match CN= on the eSigner cert; electron-builder
  # warns when it drifts. "ERISCO LLC" is what Windows shows as the
  # "Verified publisher" string in UAC and SmartScreen prompts.
  signtoolOptions:
    sign: scripts/sign.js
    publisherName: ERISCO LLC
    # MUST be set. Left unset, electron-builder defaults to
    # ["sha1", "sha256"] (windowsSignToolManager.js signFile) and calls the
    # sign hook TWICE per binary. That default assumes signtool.exe, which
    # takes the hash as an argument; CodeSignTool does not — it signs with
    # whatever the cert dictates, so the second call re-signs identically
    # with -override=true and the first result is thrown away. The cost is
    # real: every call is a Cloud eSigner round trip to an HSM plus a TOTP
    # step, so the default doubles both signing time and eSigner quota to
    # produce the same bytes. SHA-1 Authenticode is untrusted by modern
    # Windows regardless.
    signingHashAlgorithms:
      - sha256
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # NO `splashImage`, on purpose (HTOO-466). With one, the NSIS stub runs in GUI
  # mode: it paints the bitmap, hides its own "Setup" dialog, extracts, runs the
  # app, and, when the app exits, shows that hidden dialog again for its
  # completion step before `AutoCloseWindow` closes it. That is a blank window
  # that flashes after the Epona window has gone, on each close of the portable
  # exe. There is no hook to stop it: electron-builder reads `portable.nsi`
  # without change for this target.
  #
  # Without it the stub runs `SetSilent silent` and owns no window. The cost is a
  # busy cursor, and no image, while the stub extracts the app to %TEMP% on each
  # launch (measured here: about 3.3 s before the first Epona process). The in-app
  # splash (`resources/splash.html`) covers everything from Electron's first frame
  # on. Do not add the image back to fill that gap: it is the cause of the flash.
  # The template, creidhne, oghma, mabon, balor and taliesin made the same change.
  # scripts/portable-config.test.mjs pins the absence.
  #
  # Extract to a folder unique to each LAUNCH, not to each BUILD (HTOO-351,
  # fault 2).
  #
  # Left unset, electron-builder puts one KSUID into the exe at build time, so
  # each copy of a given build extracts to the same $TEMP\<ksuid>. Launch a second
  # copy and portable.nsi does `RMDir /r $INSTDIR` on the folder that the RUNNING
  # app executes from, then CopyFiles into it. That fails on the locked exe and
  # DLLs. extractAppPackage.nsh tries 5 times, 1 second apart, and then shows the
  # NSIS MB_RETRYCANCEL "Epona cannot be closed" box. One more Retry overwrites a
  # live app non-atomically, with errors ignored.
  #
  # Epona cannot change that box. portable.nsi never inserts CHECK_APP_RUNNING,
  # and PortableOptions has no `include` or `script` field. The fix is to remove
  # the collision. The second launch then reaches Electron, loses
  # requestSingleInstanceLock, and calls app.exit(0), and the first window comes
  # forward. No dialog shows.
  #
  # TRUE, not the documented `false`. app-builder-lib 26.15.3 (NsisTarget.js:246;
  # 26.17.0 has the same logic at :263) does
  #   if (typeof unpackDirName === "string" || !unpackDirName)
  #     defines.UNPACK_DIR_NAME = unpackDirName || generateKsuid()
  # so `false` takes the branch (`!false`) and still gets a build-time KSUID. Only
  # a truthy non-string skips the branch. UNPACK_DIR_NAME then stays undefined, and
  # portable.nsi falls back to $PLUGINSDIR\app, which NSIS makes unique to each
  # process. Do not "correct" this to `false`: that silently restores the
  # collision. Creidhne measured it on built exes (artifact sizes, because the NSIS
  # header is compressed).
  #
  # The cost: a killed stub leaves its whole folder in %TEMP%, because no later
  # launch uses that name again. src/main/portableSweep.js removes those folders
  # (HTOO-494). scripts/portable-config.test.mjs pins this key.
  unpackDirName: true
nsis:
  # Predictable name for the release workflow's sign + upload steps (the default
  # is "Epona Setup <version>.exe", with spaces).
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  category: public.app-category.games
  # macOS gets the square tile, not the star Windows uses: the Dock expects a
  # squircle inset to Apple's icon grid, and a full-bleed square renders larger
  # than every native app beside it. build/icon.icns is generated from
  # build/icon-square.png by scripts/make-icons.mjs and committed — the same
  # master and the same generator that write the Linux set below, so the two
  # platforms cannot drift apart.
  icon: build/icon.icns
  # da-win32 is a Windows-only native module; on macOS it compiles to an
  # empty stub that's never require()'d (the load is gated behind
  # process.platform === 'win32'). The stub is byte-identical across arches
  # and can't be lipo-merged, so tell @electron/universal to ship it as-is
  # rather than failing the arch merge.
  x64ArchFiles: '**/da_win32.node'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  category: Game
  # A DIRECTORY, and it MUST stay explicit. Two separate traps meet here.
  #
  # 1. electron-builder never resamples a single PNG (app-builder-lib's
  #    iconConverter returns a .png source as-is), so `build/icon.png` produced
  #    exactly one hicolor entry at 1024x1024. hicolor's index.theme stops at
  #    512, so nothing indexed it and every Linux desktop drew its generic
  #    blank-document icon. That is what shipped through 2.7.2.
  # 2. The Linux source list is [linux.icon, mac.icon ?? icon] — mac.icon
  #    OUTRANKS the top-level icon. Epona sets mac.icon, so deleting this key
  #    does not fall back to the top-level build/icon.png; it hands Linux the
  #    .icns, whose entries are inset to Apple's grid and draw ~12% small.
  #    buildResources/icons is only used when that list is empty, which mac.icon
  #    guarantees it never is.
  #
  # The eight PNGs come from build/icon-square.png, the same full-bleed master
  # the .icns above is built from — the square tile, NOT the star, which stays
  # Windows-only: it is the Windows artwork, the same star as the in-app window
  # icon (resources/epona-icon-256.png). Linux
  # desktops that draw square icons (Cinnamon among them) render a star's
  # transparent corners as a smaller icon than its neighbours even when its
  # bounding box is correct. Committed rather than built in CI, exactly as
  # build/icon.icns is. Regenerate BOTH with `node scripts/make-icons.mjs`;
  # scripts/icons.test.mjs fails if the tree drifts from the eight files.
  icon: build/icons
  # electron uses desktopName as app_id / WM_CLASS. Without the pair, the
  # installed entry is keyed to productName ("Epona") while Electron reports
  # "epona", so the desktop environment cannot link a running window to it and
  # the taskbar and window switcher fall back to a generic icon — a correct
  # hicolor set above is not sufficient on its own. desktopName lives in
  # package.json; this flag is what makes the .desktop FILENAME agree with it.
  # The default flips to true in electron-builder 27, which is a no-op for us
  # precisely because desktopName is set explicitly.
  syncDesktopName: true
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  target:
    - deb
    - AppImage
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
beforeBuild: npx @electron/rebuild -f -w da-win32
# Signs da_win32.node, which win.signtoolOptions.sign never sees because
# electron-builder's signable-file walk skips asarUnpack'd files. That
# addon is the one binary here whose import table reads like malware
# (CREATE_SUSPENDED, WriteProcessMemory, VirtualProtectEx to executable,
# a dynamically resolved NtQueryInformationProcess), so leaving it as the
# only unsigned file in the payload is the worst possible arrangement.
#
# The comment on electronFuses above warns against doing fuse work in an
# afterPack hook, because a per-arch hook corrupts the mac universal merge
# with an "identical SHAs" failure. That warning still stands and this
# hook respects it: it returns immediately unless the platform is win32,
# so the per-arch mac packs stay byte-identical.
afterPack: scripts/after-pack-sign.js
