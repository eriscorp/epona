appId: co.eris.epona
productName: Epona
# Turn off escape hatches built into the Electron binary that Epona never uses.
# The one that matters is runAsNode: without it,
#   ELECTRON_RUN_AS_NODE=1 Epona.exe -e "<script>"
# turns the shipped, signed binary into a general-purpose Node interpreter — a
# real capability handed to anything that can set an environment variable. It
# also makes the app immune to the trap where that variable, exported in a
# shell, makes a healthy launch look like a crash.
#
# onlyLoadAppFromAsar is the one that can break a packaged launch, and epona is
# the first app in the house to combine it with an asarUnpack'd NATIVE addon
# (da-win32 resolves out of app.asar.unpacked). Verified on a real package: the
# fuse governs where APP code is loaded from, not native module resolution, and
# the addon still loads. Re-check it if the asarUnpack list changes.
#
# Native electron-builder config, NOT an afterPack hook: on the mac universal
# build the per-arch packs must stay pristine and the fuses have to be flipped
# once on the merged app right before signing. A per-arch hook corrupts the
# universal merge with an "identical SHAs" failure.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  # Flipping fuses rewrites the Electron Framework binary and invalidates the
  # ad-hoc signature that is mandatory on Apple Silicon; re-apply it before the
  # real signing step runs.
  resetAdHocDarwinSignature: true
directories:
  buildResources: build
# ALLOWLIST, not a denylist. electron-builder packages the whole project
# directory by default and `files` subtracts from it, so the scaffold's negation
# list leaks every time a new top-level directory appears — and it did. The
# previous list also used the single-star form (`!coverage/*`), which drops only
# a directory's immediate children: coverage/lcov-report/** (7.4 MB), docs/images/**
# (5.2 MB of demo GIFs) and .github/workflows/** all still shipped inside app.asar.
# An allowlist cannot leak that way. Name what runs; everything else is absent by
# construction.
#
# resources/** must survive: it is asarUnpack'd and holds splash.html plus the
# runtime-sized logo assets. The 1024px icon master lives in build/, NOT
# resources/, and the icon: keys below point there — build/ is
# directories.buildResources, which electron-builder never packages, so the
# icons are still generated from it and the payload is gone.
#
# packages/da-win32 is the workspace member behind the `da-win32` file: dep. Its
# build output is loaded via createRequire at run time (and asarUnpack'd below),
# so the compiled addon ships while its C++ sources and binding.gyp do not.
#
# Name the ONE .node file, not build/**. node-gyp leaves 9.0 MB in build/ and
# index.js loads exactly `./build/Release/da_win32.node` from it — the rest is
# linker and MSBuild intermediates (build/Release/obj/**.tlog alone is 3.5 MB,
# plus .iobj/.ipdb/.lib/.exp). The old denylist shipped all of it because it only
# excluded src/ and binding.gyp.
#
# CHANGELOG.md ships deliberately — Settings > About > What's New reads it from
# app.getAppPath() at run time. It is the one doc that is a runtime asset.
files:
  - out/**
  - resources/**
  - node_modules/**
  # npm links the da-win32 workspace member into node_modules, so the addon's
  # build dir arrives through the broad node_modules allow above as well. Only
  # da_win32.node is loaded; subtract the MSBuild + linker leftovers beside it.
  - '!node_modules/da-win32/build/Release/obj/**'
  - '!node_modules/da-win32/build/Release/*.{exp,iobj,ipdb,lib}'
  - '!node_modules/da-win32/build/*.{vcxproj,filters}'
  - packages/da-win32/{index.js,package.json}
  - packages/da-win32/build/Release/da_win32.node
  - packages/da-win32/bin/**
  - package.json
  - CHANGELOG.md
asarUnpack:
  - resources/**
  - node_modules/da-win32/build/**
  - packages/da-win32/build/**
win:
  executableName: Epona
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # The portable exe is an NSIS self-extracting archive: every launch
  # decompresses the whole app into %TEMP% before electron exists, so no in-app
  # splash can cover it — and the stub runs `SetSilent silent` unless
  # SPLASH_IMAGE is defined, meaning the user gets nothing for several seconds
  # (measured here: ~3.3s before the first Epona process). The electron runtime
  # dominates that unpack, so slimming app.asar does not remove the wait.
  #
  # This BMP deliberately MIRRORS resources/splash.html rather than just showing
  # the icon: same 360x300 as the splash BrowserWindow, same radial gradient
  # (#16294a → #0c1524 offset toward the top), same 148px logo, same EPONA
  # wordmark (#f0e6cc, 22px, 3px tracking) and "Loading…" (#7f8fb0, 12px). The
  # extraction splash then hands off to the electron splash with no visible
  # change except the spinner starting — the gap at the bottom is where it goes.
  # A static BMP cannot animate, which is the only reason the spinner is absent.
  #
  # 24-bit, in build/ (buildResources — never packaged). Regenerate with:
  #   magick -size 360x600 radial-gradient:'#16294a'-'#0c1524' \
  #     -crop 360x300+0+204 +repage \
  #     \( build/icon.png -resize 148x148 \) -gravity north -geometry +0+18 \
  #     -composite -gravity north \
  #     -font Segoe-UI-Semibold -pointsize 22 -kerning 3 -fill '#f0e6cc' \
  #       -annotate +0+186 'EPONA' \
  #     -font Segoe-UI -pointsize 12 -kerning 1 -fill '#7f8fb0' \
  #       -annotate +0+220 'Loading…' \
  #     -flatten -strip -type TrueColor BMP3:build/portable-splash.bmp
  # (The oversized gradient + crop puts the gradient's centre at 32% height, to
  # match the CSS `radial-gradient(circle at 50% 32%, …)` in splash.html.)
  splashImage: build/portable-splash.bmp
nsis:
  # Predictable name for the release workflow's sign + upload steps (the default
  # is "Epona Setup <version>.exe", with spaces).
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  category: public.app-category.games
  icon: build/icon.png
  # da-win32 is a Windows-only native module; on macOS it compiles to an
  # empty stub that's never require()'d (the load is gated behind
  # process.platform === 'win32'). The stub is byte-identical across arches
  # and can't be lipo-merged, so tell @electron/universal to ship it as-is
  # rather than failing the arch merge.
  x64ArchFiles: '**/da_win32.node'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  category: Game
  icon: build/icon.png
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  target:
    - deb
    - AppImage
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
beforeBuild: npx @electron/rebuild -f -w da-win32
