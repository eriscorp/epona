name: Release

# TAG DIRECTLY (Sabrael, 2026-10-12). Do not rehearse a release with
# workflow_dispatch before you push the tag. The `release` job runs only after
# every build job passes, so a tag run that fails publishes nothing, and the
# fix is a re-tag. A rehearsal builds every platform twice to save that. Remote
# e2e and testing are fine (ci.yml, where the repo has one); building the
# release twice is not.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 used to live here for one holdout:
# sslcom/esigner-codesign, which still declares `using: node20`. Signing moved
# inside packaging (scripts/sign.js shells out to CodeSignTool directly), so
# that action is gone and every action here runs on node24 natively —
# actions/setup-java is pinned to v5 for the same reason. Don't reintroduce
# the flag without a holdout that needs it.

# CHECKOUT DEPTH: 1, the `actions/checkout` default, on purpose (HTOO-328).
# A depth-1 clone has no parents for the commit it checks out. Thus every
# commit reads as a root commit, no commit is a merge, and ahead/behind against
# a real upstream has no answer.
#
# Epona reads git: src/main/gitOps.js and src/main/worktreeManager.js run
# `rev-parse`, `branch -a`, `worktree` and `status`. But no step in CI points
# that code at the history of this checkout. The git unit tests (gitExec,
# gitOps, worktreeManager) and the e2e helper createTempRepoWithWorktree each
# make their own temp repo. changelog-extract.mjs reads CHANGELOG.md, and the
# release notes come from the GitHub API, not from the clone. Thus depth 1
# gives no wrong answer today.
#
# That is a weaker claim than "Epona reads no git", so the trigger is written
# here. Set `fetch-depth: 0` on a job when one of its steps reads commit
# parents, `merge-base`, ahead/behind or `git describe`, or when an e2e spec
# runs Epona against the repo of this checkout instead of a temp repo. A
# shallow clone then makes the check pass and measure nothing.

jobs:
  # The Linux jobs name `ubuntu-24.04`, not `ubuntu-latest` (house-wide,
  # 2026-10-29). GitHub moves `ubuntu-latest` to Ubuntu 26 from 2026-10-19, and
  # a new image under a release build is a change nobody chose: xvfb and the
  # packaging tools come from the image. Move to a newer image on purpose, in
  # its own commit, after one `workflow_dispatch` run on it passes.
  #
  build-windows:
    # Pinned to windows-2022 (VS 2022 / version 17). windows-latest has
    # rolled to an image with VS 18 (the "Microsoft Visual Studio\18"
    # path), and node-gyp 11.5.0 can't parse that version string — its
    # PowerShell-based VS finder returns "undefined" and then hits a
    # stdio buffer overflow, killing the da-win32 native-addon rebuild.
    # Revisit once node-gyp ships VS 18 detection (and our local Node 24
    # dev env confirms the new gyp works against da-win32).
    runs-on: windows-2022

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # THE ELECTRON BINARY: CACHE IT, AND RETRY THE INSTALL (HTOO-388).
      #
      # `npm ci` downloads the Electron binary (about 100 MB) from
      # github.com/electron/electron/releases. That server sometimes returns a
      # 503, and the job then fails on code that is correct. Dagda lost seven CI
      # runs to it in one day.
      #
      # Since Electron 42 the `electron` package has no install script. The
      # project's own postinstall runs `install-electron` (HTOO-553), inside the
      # `npm ci` step, so the env var goes on that step. `install-electron` gives
      # `cacheRoot: process.env.electron_config_cache` to `@electron/get`, so the
      # var moves the download cache to a path that `actions/cache` restores. If
      # that postinstall goes, the download moves to the first
      # `require('electron')`, in a later step without the var: the cache then
      # misses on every run, with a green tick.
      #
      # The path is under `runner.temp`, NOT the workspace. A cache directory in
      # the checkout is a directory that `eslint .` and each glob must ignore.
      #
      # The env var and the cache path are both STEP-level. The `runner` context
      # does not exist at workflow or job level. An expression there expands to
      # an empty string and does not fail, so the cache points at the root of
      # the filesystem and restores nothing, on every run, with a green tick.
      #
      # The key is package-lock.json, because the lockfile pins the Electron
      # version: a version bump misses by construction, and no other key can
      # restore an old binary. The key includes `runner.os`, because each OS
      # downloads a different zip.
      #
      # GitHub scopes a cache to the ref that saves it, and a run restores only
      # the caches of its own ref and of the default branch. No workflow runs on
      # `main`, so a cache that one tag saves never reaches the next tag. It
      # pays inside one run, when a job starts after a job on the same OS has
      # saved it, and on a re-run of the same tag, which is the remedy for a
      # 503. The retry is still the main part (Creidhne v1.15.0, HTOO-388).
      #
      # scripts/electron-cache.test.mjs pins these steps in each job.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # A cache miss gets the binary from the same server, so the install is
      # retried. `shell: bash` on every runner, so the loop has one form: Git
      # Bash is on the Windows runners. Three attempts, with a longer wait after
      # each failure. The step fails if the last attempt fails, so a real
      # `npm ci` failure still fails the job.
      - name: Install dependencies
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Rebuild native addon
        run: npm run rebuild

      # The tag's own check (HTOO-651): lint, format and the unit suite, on
      # each OS. ci.yml runs only when someone dispatches it, so without this
      # the POSIX half of the suite could miss a release entirely.
      - name: Validate
        run: npm run validate

      - name: Build app
        run: npm run build

      # WINDOWS SIGNING: CodeSignTool on a CURRENT JDK, never its bundled one
      # (HTOO-517).
      #
      # Every CodeSignTool release (v1.3.2 is the newest) bundles JDK 11.0.2 from
      # 2019, and its CodeSignTool.bat always runs that JDK. On 2026-09-30 SSL.com
      # renewed the certificate of login.ssl.com, the OAuth host CodeSignTool
      # signs in at. The new chain ends at "SSL.com TLS RSA Root CA 2022" with no
      # cross-signed copy, and the old trust store does not have that root: every
      # sign fails with `PKIX path building failed`. Temurin 17 has the root.
      #
      # This Java is REQUIRED, not a fallback. setup-java sets JAVA_HOME, and
      # scripts/sign.js runs the CodeSignTool jar on $JAVA_HOME/bin/java.exe
      # (then the `java` on PATH). It never runs the bundled JDK. Do not remove
      # this step. Without it, JAVA_HOME is the default Java of the runner
      # image, and no one has tested that Java with CodeSignTool.
      - name: Set up Java 17 for CodeSignTool
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Signing now happens INSIDE packaging via scripts/sign.js
      # (win.signtoolOptions.sign) and scripts/after-pack-sign.js, so the
      # tool has to be on disk before electron-builder runs. This replaced
      # the sslcom/esigner-codesign action, which could only sign finished
      # artifacts and therefore left the whole extracted payload unsigned.
      - name: Download CodeSignTool
        shell: pwsh
        run: |
          # Pinned deliberately. The Cloud eSigner protocol has shifted in
          # subtle ways between releases; test locally before bumping.
          $version = '1.3.2'
          $archive = "CodeSignTool-v$version-windows.zip"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v$version/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -Path $archive -DestinationPath codesigntool -Force
          # Do not assume the folder layout of the archive. Find the jar in its
          # jar/ folder, and set CODE_SIGN_TOOL_PATH to the folder above jar/.
          # CodeSignTool reads conf/ from that folder, so scripts/sign.js runs
          # it there. A version bump that adds or renames a parent folder then
          # does not break the build.
          # Stop here, not minutes into the packaging, if there is not exactly
          # one jar or if its folder is not jar/ (scripts/sign.js reads jar/).
          $jars = @(Get-ChildItem -Path codesigntool -Filter 'code_sign_tool-*.jar' -Recurse)
          if ($jars.Count -ne 1 -or $jars[0].Directory.Name -ne 'jar') {
            throw "expected one code_sign_tool-*.jar in a jar/ folder, found: $($jars.FullName -join ', '). Did the archive layout change?"
          }
          $jar = $jars[0]
          $toolDir = $jar.Directory.Parent.FullName
          "CODE_SIGN_TOOL_PATH=$toolDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CODE_SIGN_TOOL_PATH=$toolDir"
          # Show the Java that scripts/sign.js runs, in the log. Stop here if
          # JAVA_HOME has no java.exe: scripts/sign.js then runs the `java`
          # on PATH, and no one has tested that Java with CodeSignTool.
          $java = if ($env:JAVA_HOME) { Join-Path $env:JAVA_HOME 'bin/java.exe' }
          if (-not $java -or -not (Test-Path $java)) {
            throw "no java.exe under JAVA_HOME ($env:JAVA_HOME). The Java 17 step must run first."
          }
          & $java -version

      # scripts/sign.js skips silently when the ES_* vars are absent, so a
      # fork without secrets still produces a release — just an unsigned
      # one. Confirm `[sign] signed …` lines appear in this step's log
      # before trusting an artifact.
      - name: Package installer + portable exe
        run: npx electron-builder --win --publish never
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      # HTOO-374. Read the fuse wire back out of the packaged binary; no
      # earlier gate touches a packaged artifact (see scripts/verify-fuses.mjs).
      # Epona signs INSIDE packaging, so this runs after signing, but before
      # upload. Both Windows targets wrap win-unpacked, so one read covers both.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/win-unpacked/Epona.exe

      # Fail loudly rather than shipping a half-signed release: every
      # Windows PE in the payload must carry a valid Authenticode
      # signature, including the da_win32.node addon. Skipped when no
      # signing credentials are configured, since then nothing is signed
      # by design.
      - name: Verify signatures
        if: env.ES_USERNAME != ''
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
        run: |
          $targets = @(
            'dist\win-unpacked\Epona.exe',
            'dist\win-unpacked\resources\elevate.exe'
          )
          $targets += (Get-ChildItem -Path 'dist\win-unpacked\resources\app.asar.unpacked' `
            -Filter *.node -Recurse).FullName
          $targets += (Get-ChildItem -Path 'dist' -Filter *.exe).FullName

          $failed = @()
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { $failed += "$t (missing)"; continue }
            $sig = Get-AuthenticodeSignature $t
            Write-Host "$($sig.Status)`t$t"
            if ($sig.Status -ne 'Valid') { $failed += "$t ($($sig.Status))" }
          }
          if ($failed.Count -gt 0) {
            throw "Unsigned or invalid binaries:`n$($failed -join "`n")"
          }
          Write-Host "All $($targets.Count) Windows binaries carry a valid signature."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
          if-no-files-found: error
          # These exist only to hand the packages to the `release` job minutes
          # later. The published Release keeps its own copy, and release assets
          # do NOT count against Actions storage -- but these artifacts do, at
          # the 90-day default. Three releases of ~630MB exhausted the quota on
          # a sibling repo: every build job failed with "Artifact storage quota
          # has been hit", which skipped `release` and published nothing.
          retention-days: 1

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The same cache and the same retried install as the `build-windows` job. Read
      # the reasons there: `runner.temp` and the two step-level placements are
      # necessary, not style.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      # The tag's own check (HTOO-651): lint, format and the unit suite, on
      # each OS. ci.yml runs only when someone dispatches it, so without this
      # the POSIX half of the suite could miss a release entirely.
      - name: Validate
        run: npm run validate

      - name: Build app
        run: npm run build

      # da-win32's beforeBuild rebuild only makes sense on Windows; override
      # it with the noop so Linux packaging doesn't try to rebuild the addon.
      - name: Package Linux deb + AppImage
        run: npx electron-builder --linux --config.beforeBuild=scripts/noop-before-build.cjs --publish never

      # HTOO-374, per platform. Each job packs its own artifact and no other job
      # can see it, so the check has to run in each — one platform verifying its
      # own fuses says nothing about the others'.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/linux-unpacked/epona

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          # These exist only to hand the packages to the `release` job minutes
          # later. The published Release keeps its own copy, and release assets
          # do NOT count against Actions storage -- but these artifacts do, at
          # the 90-day default. Three releases of ~630MB exhausted the quota on
          # a sibling repo: every build job failed with "Artifact storage quota
          # has been hit", which skipped `release` and published nothing.
          retention-days: 1

  build-mac:
    runs-on: macos-latest

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The same cache and the same retried install as the `build-windows` job. Read
      # the reasons there: `runner.temp` and the two step-level placements are
      # necessary, not style.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      # The tag's own check (HTOO-651): lint, format and the unit suite, on
      # each OS. ci.yml runs only when someone dispatches it, so without this
      # the POSIX half of the suite could miss a release entirely.
      - name: Validate
        run: npm run validate

      - name: Build app
        run: npm run build

      # Set up our own signing keychain (rather than electron-builder's
      # CSC_LINK throwaway) so the post-build dmg codesign can reach the
      # same Developer ID identity. electron-builder auto-discovers it.
      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          # Make our keychain searchable/default for the toolchain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        id: asc
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # electron-builder signs + notarizes + staples the .app (auto-discovers
      # the identity from our keychain), then wraps it in the dmg. The noop
      # beforeBuild override skips the Windows-only da-win32 rebuild.
      - name: Package, sign + notarize app
        run: npx electron-builder --mac --config.beforeBuild=scripts/noop-before-build.cjs --publish never
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # HTOO-374. The universal .app carries one fuse wire per slice, and the
      # reader checks each. The step above already signed the .app, so this
      # runs before the dmg is signed and uploaded.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/mac-universal/Epona.app

      # The dmg itself is unsigned/un-notarized out of electron-builder, so a
      # downloaded dmg would trip Gatekeeper. Sign, notarize + staple it too.
      - name: Sign, notarize + staple the dmg
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DMG="dist/epona-${VERSION}.dmg"
          codesign --force --timestamp \
            --sign "Developer ID Application: ERISCO LLC (D4Q96JRVKU)" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          # These exist only to hand the packages to the `release` job minutes
          # later. The published Release keeps its own copy, and release assets
          # do NOT count against Actions storage -- but these artifacts do, at
          # the 90-day default. Three releases of ~630MB exhausted the quota on
          # a sibling repo: every build job failed with "Artifact storage quota
          # has been hit", which skipped `release` and published nothing.
          retention-days: 1

  release:
    runs-on: ubuntu-24.04
    needs: [build-windows, build-linux, build-mac]
    if: github.ref_type == 'tag'

    # id-token + attestations are for the provenance step below; the
    # workflow-level `contents: write` has to be restated because naming
    # permissions on a job replaces the top-level block rather than adding to
    # it, and the release step needs write to publish.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      #
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      # A user whose antivirus flags a download needs some way to tell whether
      # the bytes they hold are the bytes we published. Flat filenames, not the
      # per-artifact subdirectories download-artifact creates, so the file reads
      # the way `sha256sum -c` expects.
      - name: Generate SHA256SUMS
        run: |
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec sha256sum {} + | sed 's| .*/| |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed, GitHub-hosted proof of which workflow run produced these exact
      # bytes. Verifiable with:
      #   gh attestation verify epona-X.Y.Z-setup.exe --repo eriscorp/epona
      # Independent of Authenticode: this attests the build, the signature
      # attests the publisher. Both feed the reputation story that the
      # Wacatac false positive came down to.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-portable.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            SHA256SUMS.txt
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      # The house version manifest (versions.json in hybrasyl/cernunnos, update-check
      # module v1) is NOT written here. That write is a commit and push by the
      # developer who releases, with their own git access: the workflow has no
      # credential for cernunnos, by decision. Running apps learn of this release only
      # after that step, so this step prints the command on the run page (a notice)
      # and in the job summary. It runs before Discord, so a failed webhook cannot
      # skip it.
      - name: Remind to publish the version manifest
        if: success()
        run: |
          CMD="npm run publish:version -- ${{ github.ref_name }}"
          echo "::notice title=Publish the version manifest::Start the packaged app, then run: $CMD"
          {
            echo "### Next: publish the version manifest"
            echo
            echo "Start the packaged app from the release. Then run this in the app checkout:"
            echo
            echo "    $CMD"
            echo
            echo "Running copies of the app do not see this release until you do."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**Epona $TAG** is now available!\n$RELEASE_URL\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
