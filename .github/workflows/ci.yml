# Continuous integration for pull requests and main.
#
# release.yml only fires on a `v*` tag, so until now nothing enforced lint or
# the unit tests before a merge — a regression could reach a release build.
# This workflow gates every PR and every push to main.
#
# `lint:check` runs with `--max-warnings 0`, so ANY warning fails the job. That
# is the point: keep `eslint .` at zero permanently instead of letting warnings
# collect.
#
# The `check` and `e2e` jobs run on windows-2022, for two reasons:
#   1. `npm ci` runs `postinstall` -> `install-electron && electron-builder
#      install-app-deps`, and the second half rebuilds the Windows-only
#      `da-win32` native addon.
#   2. Epona's main process is Windows-specific (netstat parsing, taskkill,
#      PowerShell console wrappers), and its tests assert that behaviour.
# The 2022 pin matches release.yml: windows-latest carries VS 18, which
# node-gyp 11.5.0 cannot parse.
#
# `unit-posix` covers the other two platforms. That reason above is real for the
# addon and for e2e, and it does NOT extend to the unit suite: release.yml builds
# and signs macOS and Linux artifacts, so until this job existed both platforms
# were first exercised at tag time, on the file users download. Every POSIX code
# path was unrun — killPosixTree, the hybrasylTarget spawn guards, serverTarget's
# non-Windows direct spawn. The tests were there; nothing ran them.

# CHECKOUT DEPTH: 1, the `actions/checkout` default, on purpose (HTOO-328).
# A depth-1 clone has no parents for the commit it checks out. Thus every
# commit reads as a root commit, no commit is a merge, and ahead/behind against
# a real upstream has no answer.
#
# Epona reads git: src/main/gitOps.js and src/main/worktreeManager.js run
# `rev-parse`, `branch -a`, `worktree` and `status`. But no step in CI points
# that code at the history of this checkout. The git unit tests (gitExec,
# gitOps, worktreeManager) and the e2e helper createTempRepoWithWorktree each
# make their own temp repo. changelog-extract.mjs reads CHANGELOG.md, and the
# release notes come from the GitHub API, not from the clone. Thus depth 1
# gives no wrong answer today.
#
# That is a weaker claim than "Epona reads no git", so the trigger is written
# here. Set `fetch-depth: 0` on a job when one of its steps reads commit
# parents, `merge-base`, ahead/behind or `git describe`, or when an e2e spec
# runs Epona against the repo of this checkout instead of a temp repo. A
# shallow clone then makes the check pass and measure nothing.

name: CI

# MANUAL ONLY (HTOO-390). GitHub bills windows runners at 2x and macOS at 10x,
# and this workflow ran on every pull request and every push -- so a change was
# checked twice, once on the PR and again on the merge commit. One day of that
# across the house on 2026-08-12 exhausted the shared Actions allowance and the
# account hit its spending limit mid-merge.
#
# What replaces it: "npm run validate", run by hand before a push. A pre-push
# hook ran it from 2026-08-12 to 2026-10-10; it was removed because GitHub
# Desktop and Balor could not start npm from it. "npm run validate:linux" runs
# the same suite on real Linux through WSL, for the platform a Windows dev box
# cannot cover.
#
# release.yml validates at tag time: each of its three build jobs runs
# "npm run validate" before it builds (HTOO-651; until then this line said so and
# none did). It also builds the macOS and Linux artifacts, which cannot be built
# on the dev box at all.
#
# WHAT IS LOST, rather than glossed: a hosted runner is a DIFFERENT machine from
# the dev box, and on oghma it twice caught what the dev box could not -- the
# runner ships core.autocrlf=true, and its file-time clock advances about every
# 15 ms where a dev box's is finer. Fire this by hand before a release or a
# platform-shaped change:
#   gh workflow run ci.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A new push cancels the in-flight run for the same branch or
# PR — unlike release.yml, cancelling a CI check costs nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # THE ELECTRON BINARY: CACHE IT, AND RETRY THE INSTALL (HTOO-388).
      #
      # `npm ci` downloads the Electron binary (about 100 MB) from
      # github.com/electron/electron/releases. That server sometimes returns a
      # 503, and the job then fails on code that is correct. Dagda lost seven CI
      # runs to it in one day.
      #
      # Since Electron 42 the `electron` package has no install script. The
      # project's own postinstall runs `install-electron` (HTOO-553), inside the
      # `npm ci` step, so the env var goes on that step. `install-electron` gives
      # `cacheRoot: process.env.electron_config_cache` to `@electron/get`, so the
      # var moves the download cache to a path that `actions/cache` restores. If
      # that postinstall goes, the download moves to the first
      # `require('electron')`, in a later step without the var: the cache then
      # misses on every run, with a green tick.
      #
      # The path is under `runner.temp`, NOT the workspace. A cache directory in
      # the checkout is a directory that `eslint .` and each glob must ignore.
      #
      # The env var and the cache path are both STEP-level. The `runner` context
      # does not exist at workflow or job level. An expression there expands to
      # an empty string and does not fail, so the cache points at the root of
      # the filesystem and restores nothing, on every run, with a green tick.
      #
      # The key is package-lock.json, because the lockfile pins the Electron
      # version: a version bump misses by construction, and no other key can
      # restore an old binary. The key includes `runner.os`, because each OS
      # downloads a different zip.
      #
      # This workflow runs only by hand (workflow_dispatch), and GitHub removes a
      # cache that nothing uses for seven days. So the cache is usually COLD
      # here, and the retry is the part that pays. The cache stays because every
      # house app has the same steps (hyb-electron-template has them too).
      #
      # scripts/electron-cache.test.mjs pins these steps in each job.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # A cache miss gets the binary from the same server, so the install is
      # retried. `shell: bash` on every runner, so the loop has one form: Git
      # Bash is on the Windows runners. Three attempts, with a longer wait after
      # each failure. The step fails if the last attempt fails, so a real
      # `npm ci` failure still fails the job.
      - name: Install dependencies
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Lint (0 warnings tolerated)
        run: npm run lint:check

      - name: Test
        run: npm run test:coverage

      # Both narrowings are load-bearing. `--omit=dev` because eslint and
      # electron-builder never ship, so an advisory in one is something to
      # schedule rather than something that should red an unrelated PR;
      # `--audit-level=high` for the same reason at a finer grain. A gate that
      # cries wolf gets deleted, and then there is no gate. The dev tree is
      # audited by hand instead — the other half of the no-dependabot decision.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Lint and unit tests on the two platforms release.yml ships and CI never
  # exercised. No native addon and no e2e here: the addon is Windows-only by
  # design, and the Playwright specs need a built app.
  unit-posix:
    name: Unit tests (${{ matrix.os }})
    strategy:
      # One platform failing should not hide the other's result — the whole
      # point of this job is to see POSIX behaviour separately.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` is required, not a speed-up. `da-win32` sets
      # `gypfile: true`, so a plain `npm ci` invokes node-gyp on it, and its
      # binding.gyp is Windows-only — the install fails outright on both of
      # these runners. It also skips the project's `postinstall` (install-electron,
      # which downloads the Electron binary, then electron-builder
      # install-app-deps), neither of which the unit suite touches: nothing here
      # imports the addon or launches Electron, and the one file that would
      # (`legacyTarget.js`) resolves it to null off Windows.
      #
      # esbuild and rollup survive `--ignore-scripts` because both resolve their
      # native binary through platform-specific OPTIONAL dependencies
      # (`@esbuild/linux-x64`, `@rollup/rollup-darwin-arm64`, …) which are in
      # package-lock.json and which npm installs by platform. esbuild's
      # postinstall only fixes up the CLI shim; vitest and vite use the JS API,
      # which reads the optional package directly. Checked rather than assumed —
      # this is the step most likely to be "simplified" back to a plain npm ci.
      #
      # The install has the `check` job's retry (HTOO-388), but no Electron
      # cache: `--ignore-scripts` skips `install-electron`, so this job never
      # downloads the binary. The retry covers a failed registry fetch.
      - name: Install dependencies (no native builds)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Lint (0 warnings tolerated)
        run: npm run lint:check

      - name: Test
        run: npm test

  # The Playwright/Electron specs drive the BUILT app and measure real window
  # geometry, so they need the native addon and a full build. They are slower
  # than the unit tests and run as their own job to keep the lint/test signal
  # fast and separable.
  e2e:
    runs-on: windows-2022

    steps:
      # Depth 1 is deliberate. See CHECKOUT DEPTH at the top of this file.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The same cache and the same retried install as the `check` job. Read
      # the reasons there: `runner.temp` and the two step-level placements are
      # necessary, not style.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Rebuild native addon
        run: npm run rebuild

      # `npm run e2e` builds first; the specs load out/main/index.js.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
